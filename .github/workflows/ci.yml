# Bij elke push: lint, typecheck, tests (met een echte PostgreSQL) en de build.
# Controleert ook dat prisma/migrations en schema.prisma bij elkaar passen, zodat
# een schemawijziging zonder migratie hier al opvalt en niet pas bij db-bijwerken.sh.
name: CI

on:
  push:
  pull_request:

jobs:
  controleren:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ids_portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ids_portal_test
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ids_portal_shadow
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ids_portal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Migraties passen bij het schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE ids_portal_shadow"
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/basis-schema.prisma --script \
            | diff - prisma/migrations/0_basis/migration.sql
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
